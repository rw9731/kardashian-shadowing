<style>
:root{--bg:#fafaf9;--card:#fff;--t:#1c1917;--t2:#78716c;--b:#e7e5e4;--a:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a09;--card:#1c1917;--t:#f5f5f4;--t2:#a8a29e;--b:#292524;--a:#60a5fa}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 -apple-system,system-ui,"PingFang SC","Noto Sans SC",sans-serif;background:var(--bg);color:var(--t)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--b);padding:10px 12px}
.wrap{max-width:820px;margin:0 auto}.pw{position:relative;aspect-ratio:16/9;max-height:38vh;margin:0 auto;border-radius:12px;overflow:hidden;background:#000}
#player{position:absolute;inset:0;width:100%;height:100%}
.now{margin:8px 0 6px;font-weight:600}.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:inherit;border:1px solid var(--b);background:var(--card);color:var(--t);border-radius:999px;padding:6px 14px;cursor:pointer}
button.on{background:var(--a);color:#fff;border-color:var(--a)}.hint{color:var(--t2);font-size:12px}
h2{font-size:18px;margin:28px 0 10px}main{padding:0 12px 60px}
.it{display:flex;gap:12px;background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;margin:10px 0}
.it.cur{border-color:var(--a);box-shadow:0 0 0 2px var(--a) inset}
.pl{flex:none;width:52px;height:52px;border-radius:50%;border:none;background:var(--a);color:#fff;font-size:22px;padding:0}
.ln{font-size:17px;font-weight:600}.who{color:var(--t2);font-size:13px}.ex{margin-top:4px;font-size:14px}.ex b{color:var(--a)}
.eg{color:var(--t2);font-size:14px;font-style:italic}#err{color:#dc2626;font-size:13px}
</style></head><body>
<div class="top"><div class="wrap">

<main class="wrap"><h1 style="font-size:22px;margin:16px 0 0">卡戴珊姐妹 · 原声跟读</h1>
<div class="hint">原声来自 YouTube 官方嵌入播放器，只播放对应的那一句。时间点来自自动字幕，可能有半秒左右误差。</div><div id="list"></div></main>
<script>
const G=[{"label": "情绪反应 & 感叹", "items": [{"line": "I'm just obsessed with 112.", "who": "Kim · Vogue 73Q", "expr": "be obsessed with", "zh": "超级喜欢、着迷（美式夸张常用）", "ex": "I'm obsessed with this new coffee place.", "v": "QaZ93sibpk0", "s": 217, "e": 222}, {"line": "Oh my gosh, you're going all out!", "who": "Kardashians · KUWTK (E!)", "expr": "go all out", "zh": "全力以赴、下血本、搞得很隆重", "ex": "They went all out for her birthday party.", "v": "NursHrP1TdQ", "s": 215, "e": 222}, {"line": "I'm shocked that fits you.", "who": "Kardashians · KUWTK (E!)", "expr": "I'm shocked (that)…", "zh": "我真没想到…（惊讶的口语开头）", "ex": "I'm shocked he actually showed up on time.", "v": "NursHrP1TdQ", "s": 230, "e": 235}, {"line": "I'm so excited… this makes me so happy.", "who": "Kourtney · Ellen", "expr": "this makes me so happy", "zh": "这让我好开心（直接表达情绪）", "ex": "Seeing you guys here makes me so happy.", "v": "h9h2zfyrkH8", "s": 124, "e": 129}, {"line": "You guys got me!", "who": "Kourtney · Ellen", "expr": "You got me", "zh": "你们骗到我了 / 被你们整到了", "ex": "Okay, you got me — I really thought it was real.", "v": "h9h2zfyrkH8", "s": 66, "e": 75}, {"line": "That's crazy.", "who": "Khloé · KUWTK (E!)", "expr": "That's crazy", "zh": "太离谱了 / 不可思议", "ex": "You flew there and back in one day? That's crazy.", "v": "NursHrP1TdQ", "s": 173, "e": 180}, {"line": "I just feel really underdressed.", "who": "Kendall · KUWTK (E!)", "expr": "underdressed", "zh": "穿得太随便（相对场合）", "ex": "Everyone wore suits and I felt so underdressed.", "v": "NursHrP1TdQ", "s": 270, "e": 274}, {"line": "I can't handle this anymore.", "who": "Kardashians · KUWTK (E!)", "expr": "can't handle this", "zh": "受不了了、扛不住了", "ex": "Three meetings in a row? I can't handle this.", "v": "NursHrP1TdQ", "s": 91, "e": 95}, {"line": "So kind of stressing.", "who": "Kim · Vogue 73Q", "expr": "stressing", "zh": "有点焦虑（stressing out 的口语省略）", "ex": "Exams are next week, so I'm kind of stressing.", "v": "QaZ93sibpk0", "s": 190, "e": 194}]}, {"label": "俚语 & 潮流说法", "items": [{"line": "Kendall, that'll fit you, it's so bomb.", "who": "Kardashians · KUWTK (E!)", "expr": "so bomb", "zh": "超赞、绝了（俚语）", "ex": "This taco place is so bomb.", "v": "NursHrP1TdQ", "s": 341, "e": 345}, {"line": "Whatever, you're a hater.", "who": "Kardashians · KUWTK (E!)", "expr": "hater", "zh": "酸你的人、黑子", "ex": "Ignore the haters and keep posting.", "v": "NursHrP1TdQ", "s": 323, "e": 327}, {"line": "You're not going to ruin my night.", "who": "Kardashians · KUWTK (E!)", "expr": "ruin my night / day", "zh": "扫我的兴", "ex": "Don't let one rude comment ruin your day.", "v": "NursHrP1TdQ", "s": 324, "e": 328}, {"line": "…it's always just chill vibes.", "who": "Kendall · KUWTK (E!)", "expr": "chill vibes", "zh": "轻松惬意的氛围", "ex": "The café has such chill vibes.", "v": "NursHrP1TdQ", "s": 258, "e": 262}, {"line": "I just ran upstairs real quick.", "who": "Khloé · KUWTK (E!)", "expr": "real quick", "zh": "很快地、一下下（口语用法，替代 quickly）", "ex": "Let me grab my phone real quick.", "v": "NursHrP1TdQ", "s": 171, "e": 176}, {"line": "…this sister night is turning into just cat fights left and right.", "who": "Kardashians · KUWTK (E!)", "expr": "catfight; left and right", "zh": "女生之间的争吵；到处都是、接连不断", "ex": "Emails are coming in left and right.", "v": "NursHrP1TdQ", "s": 333, "e": 340}, {"line": "At least for once there's no beef with me and Kourt.", "who": "Kardashians · KUWTK (E!)", "expr": "beef (with sb)", "zh": "矛盾、过节（俚语）", "ex": "I have no beef with him, we're cool.", "v": "NursHrP1TdQ", "s": 337, "e": 342}, {"line": "Who is the craziest sibling? — Drunk or sober?", "who": "Kendall · Vogue 73Q", "expr": "drunk or sober?", "zh": "反问式幽默：要看情况", "ex": "Who's the loudest? Tired or caffeinated?", "v": "lsFPbgK1v9I", "s": 155, "e": 161}]}, {"label": "家庭吵架 & 冲突", "items": [{"line": "Kourtney, you just have a way of rubbing people the wrong way.", "who": "Kardashians · KUWTK (E!)", "expr": "rub sb the wrong way", "zh": "惹人不快、让人反感", "ex": "His tone just rubs me the wrong way.", "v": "NursHrP1TdQ", "s": 81, "e": 87}, {"line": "Kourtney, you're being annoying.", "who": "Kardashians · KUWTK (E!)", "expr": "you're being + adj", "zh": "你现在这样很…（指当下的行为，不是本性）", "ex": "You're being dramatic, it's fine.", "v": "NursHrP1TdQ", "s": 61, "e": 66}, {"line": "Don't even act like you know what I'm talking about.", "who": "Kardashians · KUWTK (E!)", "expr": "don't act like…", "zh": "别装作…", "ex": "Don't act like you didn't see my text.", "v": "NursHrP1TdQ", "s": 76, "e": 83}, {"line": "Everyone is dropping left and right from all these schedule changes.", "who": "Kardashians · KUWTK (E!)", "expr": "drop (out)", "zh": "退出、放鸽子", "ex": "Two people dropped out of the trip.", "v": "NursHrP1TdQ", "s": 93, "e": 99}, {"line": "We built up pent-up frustration.", "who": "Kardashians · KUWTK (E!)", "expr": "pent-up frustration", "zh": "憋了很久的怒气", "ex": "She finally let out all that pent-up frustration.", "v": "NursHrP1TdQ", "s": 120, "e": 127}, {"line": "You need to set the tone.", "who": "Kardashians · KUWTK (E!)", "expr": "set the tone", "zh": "定下基调、立规矩", "ex": "The first meeting sets the tone for the project.", "v": "NursHrP1TdQ", "s": 132, "e": 137}, {"line": "Change your attitude.", "who": "Kardashians · KUWTK (E!)", "expr": "change your attitude", "zh": "态度改一改", "ex": "If you want the job, change your attitude.", "v": "NursHrP1TdQ", "s": 162, "e": 168}, {"line": "…so that's why I'm just, like, annoyed.", "who": "Kendall · KUWTK (E!)", "expr": "that's why I'm…", "zh": "所以我才会…（解释情绪原因）", "ex": "You promised, so that's why I'm upset.", "v": "NursHrP1TdQ", "s": 268, "e": 273}, {"line": "He still says he does not remember anything.", "who": "Khloé · KUWTK (E!)", "expr": "doesn't remember anything", "zh": "说自己什么都不记得（推卸）", "ex": "He claims he doesn't remember anything.", "v": "NursHrP1TdQ", "s": 206, "e": 211}]}, {"label": "事业 & 自信表达", "items": [{"line": "Maybe if you had a business you were passionate about, you'd know what it takes to run a business.", "who": "Kim · KUWTK (E!)", "expr": "what it takes; run a business", "zh": "需要付出什么；经营生意", "ex": "You don't know what it takes to raise a kid alone.", "v": "NursHrP1TdQ", "s": 69, "e": 75}, {"line": "I'm so detail-oriented and I have really good organizational skills.", "who": "Kris · Ellen", "expr": "detail-oriented", "zh": "注重细节（面试高频词）", "ex": "I'm detail-oriented, so I catch small mistakes.", "v": "UBznhsLmTHM", "s": 239, "e": 245}, {"line": "I'm a good self-starter.", "who": "Kris · Ellen", "expr": "self-starter", "zh": "自驱力强、不用人催", "ex": "We need a self-starter for this role.", "v": "UBznhsLmTHM", "s": 243, "e": 247}, {"line": "I have a good attitude about that.", "who": "Kris · Ellen", "expr": "have a good attitude about", "zh": "对…持积极态度", "ex": "She has a good attitude about feedback.", "v": "UBznhsLmTHM", "s": 145, "e": 150}, {"line": "You can vet them through that.", "who": "Kris · Ellen", "expr": "vet", "zh": "审核、把关（人或信息）", "ex": "We vet every supplier before signing.", "v": "UBznhsLmTHM", "s": 256, "e": 260}, {"line": "Well, you'd have to show me how that would all work out.", "who": "Ellen to Kris · Ellen", "expr": "work out", "zh": "（事情）怎么安排、行得通", "ex": "Let's see how it all works out.", "v": "UBznhsLmTHM", "s": 138, "e": 144}, {"line": "A dream come true.", "who": "Kendall · Vogue 73Q", "expr": "a dream come true", "zh": "梦想成真", "ex": "Working here is a dream come true.", "v": "lsFPbgK1v9I", "s": 68, "e": 72}, {"line": "It ain't as easy as it looks.", "who": "Kendall · Vogue 73Q", "expr": "not as easy as it looks", "zh": "看着容易做着难", "ex": "Cooking for ten is not as easy as it looks.", "v": "lsFPbgK1v9I", "s": 220, "e": 225}, {"line": "We're all super independent women.", "who": "Kendall · Vogue 73Q", "expr": "independent women", "zh": "独立女性", "ex": "She's a super independent woman.", "v": "lsFPbgK1v9I", "s": 162, "e": 167}]}, {"label": "日常口头禅 & 填充词", "items": [{"line": "Literally take whatever you want.", "who": "Kourtney · KUWTK (E!)", "expr": "literally", "zh": "真的、完全（强调词，口语常用）", "ex": "I literally just woke up.", "v": "NursHrP1TdQ", "s": 281, "e": 287}, {"line": "You just have to wing it.", "who": "Kim · Vogue 73Q", "expr": "wing it", "zh": "临场发挥、边做边学", "ex": "I didn't prepare, I'll just wing it.", "v": "QaZ93sibpk0", "s": 118, "e": 122}, {"line": "Family is everything.", "who": "Kim · Vogue 73Q", "expr": "… is everything", "zh": "…最重要", "ex": "For me, sleep is everything.", "v": "QaZ93sibpk0", "s": 109, "e": 114}, {"line": "It is really rare, so lucky you.", "who": "Kim · Vogue 73Q", "expr": "lucky you", "zh": "你运气真好（俏皮）", "ex": "Front-row seats? Lucky you!", "v": "QaZ93sibpk0", "s": 23, "e": 28}, {"line": "There's no such thing as a lazy day.", "who": "Kim · Vogue 73Q", "expr": "there's no such thing as…", "zh": "根本不存在…", "ex": "There's no such thing as a free lunch.", "v": "QaZ93sibpk0", "s": 37, "e": 42}, {"line": "My sisters and I are on a group chat always getting parenting advice.", "who": "Kim · Vogue 73Q", "expr": "group chat", "zh": "群聊", "ex": "I'll send it to the group chat.", "v": "QaZ93sibpk0", "s": 119, "e": 124}, {"line": "Um, not too often anymore.", "who": "Kendall · Vogue 73Q", "expr": "um / not too often anymore", "zh": "思考填充词；现在不怎么…了", "ex": "Do you still play? — Not too often anymore.", "v": "lsFPbgK1v9I", "s": 13, "e": 17}, {"line": "If I told you, it wouldn't be a secret anymore.", "who": "Kendall · Vogue 73Q", "expr": "幽默拒答", "zh": "礼貌又俏皮地拒绝回答", "ex": "If I told you, I'd have to… just kidding.", "v": "lsFPbgK1v9I", "s": 120, "e": 126}, {"line": "Does that make sense? — Not at all.", "who": "Kendall · Vogue 73Q", "expr": "does that make sense?", "zh": "这么说你懂吗？（确认对方理解）", "ex": "We split it three ways, does that make sense?", "v": "lsFPbgK1v9I", "s": 248, "e": 253}, {"line": "Great, because I can give them back.", "who": "Kendall · Vogue 73Q", "expr": "give them back", "zh": "当阿姨的好处：玩完还回去", "ex": "I love babysitting because I can give them back.", "v": "lsFPbgK1v9I", "s": 178, "e": 183}, {"line": "I'm in my robe, I need to get up.", "who": "Kendall · KUWTK (E!)", "expr": "I need to get up", "zh": "我得起来了（自我催促）", "ex": "Ugh, I'm so cozy but I need to get up.", "v": "NursHrP1TdQ", "s": 351, "e": 355}, {"line": "No, we know your name! I just couldn't see you.", "who": "Kourtney · Ellen", "expr": "No, + 解释", "zh": "No 开头化解尴尬（不是否认，是安抚）", "ex": "No, I loved it! I was just tired.", "v": "h9h2zfyrkH8", "s": 100, "e": 104}, {"line": "We had to keep it quiet.", "who": "Kourtney · Ellen", "expr": "keep it quiet", "zh": "保密、别声张", "ex": "Keep it quiet until it's official.", "v": "h9h2zfyrkH8", "s": 228, "e": 232}, {"line": "Seriously.", "who": "Kourtney · Ellen", "expr": "seriously", "zh": "真的（加强语气）", "ex": "Seriously, thank you so much.", "v": "h9h2zfyrkH8", "s": 242, "e": 250}]}];const L=[];G.forEach(g=>g.items.forEach(i=>L.push(i)));
let player,ready=false,cur=-1,loop=false,rate=1;
const list=document.getElementById('list');let n=0;
G.forEach(g=>{const h=document.createElement('h2');h.textContent=g.label;list.appendChild(h);
g.items.forEach(it=>{const i=n++;const d=document.createElement('div');d.className='it';d.id='it'+i;
d.innerHTML=`<button class="pl" aria-label="播放">▶</button><div><div class="ln"></div><div class="who"></div><div class="ex"><b></b> — <span></span></div><div class="eg"></div></div>`;
d.querySelector('.ln').textContent=it.line;d.querySelector('.who').textContent=`${it.who} · ${fmt(it.s)}–${fmt(it.e)}`;
d.querySelector('.ex b').textContent=it.expr;d.querySelector('.ex span').textContent=it.zh;d.querySelector('.eg').textContent='例：'+it.ex;
d.querySelector('.pl').onclick=()=>play(i);list.appendChild(d);});});
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function play(i){if(!ready)return;cur=i;const it=L[i];
document.querySelectorAll('.it.cur').forEach(e=>e.classList.remove('cur'));document.getElementById('it'+i).classList.add('cur');
document.getElementById('now').textContent=`#${i+1} ${it.line}`;
player.loadVideoById({videoId:it.v,startSeconds:it.s,endSeconds:it.e});}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,origin:location.origin},
events:{onReady:()=>{ready=true;window.__ready=true},
onStateChange:e=>{if(e.data===YT.PlayerState.PLAYING){window.__played=(window.__played||0)+1;if(player.getPlaybackRate()!==rate)player.setPlaybackRate(rate)}
 if(e.data===YT.PlayerState.ENDED&&loop&&cur>=0)setTimeout(()=>play(cur),400)},
onError:e=>{window.__err=e.data;document.getElementById('err').textContent='播放器错误 '+e.data+'（可能该视频禁止嵌入）'}}});}
document.getElementById('rep').onclick=()=>cur>=0&&play(cur);
document.getElementById('next').onclick=()=>play(Math.min(L.length-1,cur+1));
const lb=document.getElementById('loop');lb.onclick=()=>{loop=!loop;lb.classList.toggle('on',loop)};
document.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{rate=+b.dataset.r;document.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b));if(ready)player.setPlaybackRate(rate)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();cur>=0?play(cur):play(0)}else if(e.key==='l'||e.key==='L')lb.click();else if(e.key==='ArrowDown')play(Math.min(L.length-1,cur+1))});
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
